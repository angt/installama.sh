name: Build any cpu

on:
  workflow_call:
    inputs:
      filter:
        required: true
        type: string
      deploy:
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      filter:
        required: true
        type: string
      deploy:
        description: 'Deploy?'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: "0.16.0-dev.3006+94355f192"

    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        run: |
          ZIG="zig-$(uname -m)-linux-$ZIG_VERSION"
          curl -sSf "https://ziglang.org/builds/$ZIG.tar.xz" | tar -Jxf- -C ~
          sudo ln -sf ~/"$ZIG"/zig /usr/bin/zig

      - name: Build ${{ inputs.filter }}
        run: cmake -DFILTER=${{ inputs.filter }} -P build.cmake

      - name: Deploy
        if: ${{ inputs.deploy && vars.HF_REPO != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "hf[hf_xet]"
          hf buckets sync output hf://buckets/${{ vars.HF_REPO_BUILD }}
