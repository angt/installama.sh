name: Build all cuda
on:
  workflow_dispatch:
jobs:
  dispatch:
    name: ${{ matrix.filter }}
    strategy:
      fail-fast: false
      matrix:
        filter:
          - '50'
          - '61'
          - '70'
          - '75'
          - '80'
          - '86'
          - '89'
          - probe
    uses: ./.github/workflows/build-any-cuda.yml
    with:
      filter: ${{ matrix.filter }}
    secrets: inherit
