name: Build any metal

on:
  workflow_call:
    inputs:
      filter:
        required: true
        type: string
      deploy:
        required: false
        type: boolean
        default: true
      llamacpp_repo:
        description: 'llama.cpp repository'
        required: false
        type: string
        default: 'https://github.com/ggml-org/llama.cpp'
      llamacpp_version:
        description: 'llama.cpp version'
        required: false
        type: string
        default: 'master'
      boringssl_repo:
        description: 'boringssl repository'
        required: false
        type: string
        default: 'https://boringssl.googlesource.com/boringssl'
      boringssl_version:
        description: 'boringssl version'
        required: false
        type: string
        default: 'main'

  workflow_dispatch:
    inputs:
      filter:
        required: true
        type: string
      deploy:
        description: 'Deploy?'
        required: false
        type: boolean
        default: true
      llamacpp_repo:
        description: 'llama.cpp repository'
        required: false
        type: string
        default: 'https://github.com/ggml-org/llama.cpp'
      llamacpp_version:
        description: 'llama.cpp version'
        required: false
        type: string
        default: 'master'
      boringssl_repo:
        description: 'boringssl repository'
        required: false
        type: string
        default: 'https://boringssl.googlesource.com/boringssl'
      boringssl_version:
        description: 'boringssl version'
        required: false
        type: string
        default: 'main'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ inputs.filter }}
        env:
          LLAMACPP_REPO: ${{ inputs.llamacpp_repo }}
          LLAMACPP_VERSION: ${{ inputs.llamacpp_version }}
          BORINGSSL_REPO: ${{ inputs.boringssl_repo }}
          BORINGSSL_VERSION: ${{ inputs.boringssl_version }}
        run: cmake -DFILTER=${{ inputs.filter }} -P build.cmake

      - name: Deploy
        if: ${{ inputs.deploy && vars.HF_REPO != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "hf[hf_xet]"
          hf buckets sync output hf://buckets/${{ vars.HF_REPO_BUILD }}
