    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: monospace;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        h1 {
            text-align: center;
            font-size: 40px;
            margin: 0;
            margin-top: 24px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .platform-section {
            width: 100%;
            text-align: center;
            margin-top: 48px;
        }
        .platform-section:first-of-type {
            margin-top: 0;
        }
        .platform-section p {
            margin-bottom: 16px;
        }
        .command-box {
            background: #e8e8e8;
            border-radius: 8px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .command-box pre {
            flex: 1;
            margin: 0;
            text-align: center;
        }
        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            opacity: 0.6;
            flex-shrink: 0;
            position: relative;
        }
        .copy-btn:hover {
            opacity: 1;
        }
        .copy-btn.copied::after {
            content: "Copied!";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 4px;
            background: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            animation: fadeOut 1.5s forwards;
        }
        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }
        footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 48px;
            color: #666;
            font-size: 14px;
        }
        footer a {
            color: #666;
        }
        .separator {
            color: #999;
        }
    </style>
</head>

        function copyToClipboard(button, text) {

                setTimeout(() => {
                    button.classList.remove('copied');
                }, 1500);
            });
