name: Build any metal

on:
  workflow_call:
    inputs:
      filter:
        required: true
        type: string
      deploy:
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      filter:
        required: true
        type: string
      deploy:
        description: 'Deploy?'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ inputs.filter }}
        run: cmake -DFILTER=${{ inputs.filter }} -P build.cmake

      - name: Deploy
        if: ${{ inputs.deploy && vars.HF_REPO != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "hf[hf_xet]"
          hf buckets sync output hf://buckets/${{ vars.HF_REPO_BUILD }}
