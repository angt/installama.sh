name: Build all metal
on:
  workflow_dispatch:
  schedule:
    - cron: 0 1 * * 1
jobs:
  dispatch:
    name: ${{ matrix.filter }}
    strategy:
      fail-fast: false
      matrix:
        filter:
          - aarch64-macos-metal-m1
          - aarch64-macos-metal-m2
          - aarch64-macos-metal-m3
          - aarch64-macos-metal-m4
          - aarch64-macos-metal-m5
    uses: ./.github/workflows/build-any-metal.yml
    with:
      filter: ${{ matrix.filter }}
    secrets: inherit
