name: Build any metal

on:
  workflow_call:
    inputs:
      filter:
        type: string
        default: 'metal'
      deploy:
        type: boolean
      llamacpp_repo:
        type: string
      llamacpp_version:
        type: string
      boringssl_repo:
        type: string
      boringssl_version:
        type: string

  workflow_dispatch:
    inputs:
      filter:
        type: string
        default: 'metal'
      deploy:
        description: 'Deploy?'
        type: boolean
      llamacpp_repo:
        description: 'llama.cpp repository'
        type: string
      llamacpp_version:
        description: 'llama.cpp version'
        type: string
      boringssl_repo:
        description: 'boringssl repository'
        type: string
      boringssl_version:
        description: 'boringssl version'
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ inputs.filter }}
        env:
          LLAMACPP_REPO: ${{ inputs.llamacpp_repo }}
          LLAMACPP_VERSION: ${{ inputs.llamacpp_version }}
          BORINGSSL_REPO: ${{ inputs.boringssl_repo }}
          BORINGSSL_VERSION: ${{ inputs.boringssl_version }}
        run: cmake -DFILTER=${{ inputs.filter }} -P build.cmake

      - name: Deploy
        if: ${{ inputs.deploy && vars.HF_REPO != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "hf[hf_xet]"
          hf buckets sync output hf://buckets/${{ vars.HF_REPO_BUILD }}
